[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bev-research"
version = "0.2.0"
description = "Simulation-informed thermal demand and a forecasting benchmark for underground mining battery electric vehicles"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Athif Shaffy" }]
keywords = [
    "battery electric vehicles",
    "underground mining",
    "thermal runaway",
    "early warning",
    "haulage simulation",
    "temperature forecasting",
]
classifiers = [
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
test = ["pytest>=7.0"]
# Reproducing the ORIGINAL experiment_a model fits, as opposed to this
# repository's numpy implementation, needs these exact versions.
original = ["scikit-learn==1.7.2", "scipy==1.16.3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 88
target-version = "py310"
